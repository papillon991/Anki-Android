name: Release APK

# On every push to main, build the arm64 release APK and publish it to Releases.
# The upstream workflows are disabled on this fork (the files are kept to avoid rebase conflicts).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The key is unpacked to a temp folder outside the repo; the password is only passed to the build step. Stop here if missing.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD secrets are required."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"

      - name: Build APK
        env:
          ORG_GRADLE_PROJECT_FORK_STORE_FILE: ${{ runner.temp }}/signing.p12
          ORG_GRADLE_PROJECT_FORK_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew :AnkiDroid:assembleFullRelease --no-daemon --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          APK=$(ls AnkiDroid/build/outputs/apk/full/release/*arm64-v8a*.apk | head -n1)
          VERSION=$(grep -m1 -E '^ *versionName *= *"' AnkiDroid/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VERSION}.${RUN_NUMBER}"
          cp "$APK" "AnkiDroid-fork-${TAG}.apk"
          gh release create "$TAG" "AnkiDroid-fork-${TAG}.apk" \
            --title "$TAG" \
            --notes "$(git log -1 --pretty=%s)" \
            --target "$GITHUB_SHA"
